<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho</title>
</head>
<body>
    <input type="text" id="idNota" placeholder="Digite a nota do aluno">
    <input type="text" id="idFreq" placeholder="Digite a frequencia do aluno">

    <button onclick="analisar()">analisar aluno</button>

    <p id="idResultado"></p>
    
</body>
<script>
function analisar(){
    let nota = Number(idNota.value);
    let freq = Number(idFreq.value);
    let clean = 0;

    if (nota < 0 || nota > 10){
        alert("Onde já se viu nota <0 ou >10?!");
        clean = 1;
    }

    if (freq < 0 || freq > 100){
        alert("Onde já se viu frequência <0 ou >100?!");
        clean = 1;
    }

    if (nota > 0 && nota < 6){
        idResultado.innerHTML = "aluno ficou abaixo da média";
    }

    if (nota >= 6 && nota <= 8){
        idResultado.innerHTML = "aluno ficou na média";
    }

    if (nota > 8 && nota <= 10){
        idResultado.innerHTML = "Aluno acima da média";
    }

    if (freq >= 75){
        idResultado.innerHTML += "<br>Aluno aprovado por frequência";
    } else {
        idResultado.innerHTML += "<br>Aluno reprovado por frequência";
    }
}
</script>
</html>
